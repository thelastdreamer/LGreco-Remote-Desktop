[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dbus]
command=dbus-daemon --system --fork
autostart=true
autorestart=true

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24 -ac +extension RANDR
autostart=true
autorestart=true
environment=DISPLAY=:99

[program:xfce4]
command=xfce4-session
autostart=true
autorestart=true
environment=DISPLAY=:99

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -quiet -listen 0.0.0.0 -xkb
autostart=true
autorestart=true

[program:pulseaudio]
command=pulseaudio --start --exit-idle-time=-1 --disallow-exit --system=false
autostart=true
autorestart=true

[program:novnc]
command=websockify --web /usr/share/novnc 8081 localhost:5900
autostart=true
autorestart=true

[program:gstreamer]
command=python3 /gst-pipeline.py
autostart=true
autorestart=true
environment=DISPLAY=:99
