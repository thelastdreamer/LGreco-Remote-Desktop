version: "3.8"

services:
  api:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rd-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.rd-api.entrypoints=websecure"
      - "traefik.http.routers.rd-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.rd-api.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  db:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  redis:
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  coturn:
    labels:
      - "traefik.enable=false"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
