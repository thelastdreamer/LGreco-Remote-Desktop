services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rdpassword}
      POSTGRES_DB: ${DB_NAME:-remote_desktop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rduser} -d ${DB_NAME:-remote_desktop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-rduser}
      DB_PASSWORD: ${DB_PASSWORD:-rdpassword}
      DB_NAME: ${DB_NAME:-remote_desktop}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-64-char-string}
      REDIS_ADDR: redis:6379
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-turn:${DOMAIN:-localhost}:3478}
      TURN_USERNAME: ${TURN_USERNAME:-rdturnuser}
      TURN_PASSWORD: ${TURN_PASSWORD:-rdturnpass}
      DOCKER_NETWORK: rd-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-65535:49152-65535/udp"
    environment:
      TURN_REALM: ${DOMAIN:-localhost}
      TURN_USERNAME: ${TURN_USERNAME:-rdturnuser}
      TURN_PASSWORD: ${TURN_PASSWORD:-rdturnpass}
    command:
      - --lt-cred-mech
      - --realm=${DOMAIN:-localhost}
      - --user=${TURN_USERNAME:-rdturnuser}:${TURN_PASSWORD:-rdturnpass}
      - --external-ip=${PUBLIC_IP:-auto}
      - --min-port=49152
      - --max-port=65535
      - --listening-port=3478
      - --no-multicast-peers
      - --verbose

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: rd-network
    driver: bridge
