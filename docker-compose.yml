services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rdpassword}
      POSTGRES_DB: ${DB_NAME:-remote_desktop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rduser} -d ${DB_NAME:-remote_desktop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-rduser}
      DB_PASSWORD: ${DB_PASSWORD:-rdpassword}
      DB_NAME: ${DB_NAME:-remote_desktop}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-64-char-string}
      REDIS_ADDR: redis:6379
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-turn:${DOMAIN:-localhost}:3478}
      TURN_USERNAME: ${TURN_USERNAME:-rdturnuser}
      TURN_PASSWORD: ${TURN_PASSWORD:-rdturnpass}
      DOCKER_NETWORK: rd-network
      DESKTOP_IMAGE: ${DESKTOP_IMAGE:-rd-desktop:latest}
      RELAY_IMAGE: ${RELAY_IMAGE:-rd-relay:latest}
      DESKTOP_BUILD_CONTEXT: /build/desktop-container
      RELAY_BUILD_CONTEXT: /build/relay-container
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-ChangeMeNow!123}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  desktop-image:
    # Keep the runtime image locally available so the API can spawn per-session containers.
    build:
      context: ./desktop-container
      dockerfile: Dockerfile
    image: rd-desktop:latest
    restart: unless-stopped
    command: ["sleep", "infinity"]

  relay-image:
    # Keep the relay runtime image locally available for on-demand session creation.
    build:
      context: ./relay-container
      dockerfile: Dockerfile
    image: rd-relay:latest
    restart: unless-stopped
    command: ["sleep", "infinity"]

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    ports:
      # STUN/TURN signaling only + 50 UDP relay ports (Dokploy-safe; avoid 16k mappings)
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49201:49152-49201/udp"
    environment:
      TURN_REALM: ${DOMAIN:-localhost}
      TURN_USERNAME: ${TURN_USERNAME:-rdturnuser}
      TURN_PASSWORD: ${TURN_PASSWORD:-rdturnpass}
    command:
      - --lt-cred-mech
      - --realm=${DOMAIN:-localhost}
      - --user=${TURN_USERNAME:-rdturnuser}:${TURN_PASSWORD:-rdturnpass}
      - --external-ip=${PUBLIC_IP:-auto}
      - --min-port=49152
      - --max-port=49201
      - --listening-port=3478
      - --no-multicast-peers
      - --verbose

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: rd-network
    driver: bridge
